<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Mercadinho</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="titulo">
            <img src="./assets/logo.png" alt="" width="120px" height="120px">
            <h1>Meu Mercadinho</h1>
        </div>
        
        <p id="mensagem"></p>
        
        <form id="formMercado">
            <div class="form-group">
                <div class="item">
                    <label>📦 - Produto</label>
                    <input type="text" id="nome" placeholder="Nome do Produto" required>
                </div>
                <div class="item">
                    <label>📋 - Quantidade</label>
                    <input type="number" id="quantidade" placeholder="Quantidade" min="1" required>
                </div>
                <div class="item">
                    <label>🏷️ - Preço</label>
                    <input type="number" id="preco" placeholder="Preço Unitário (R$)" step="0.01" min="0.01" required>
                </div>
                <div class="item">
                    <button class="cadastrar-compra" type="submit">Cadastrar compra</button>
                </div>
            </div>
        </form>

        <div class="lista-container">
            <h3>Lista de Produtos</h3>
            <table>

                <div id="listaCompras"></div>
            </table>
            
            
            <div class="total-container">
                <h2 id="totalGeral">Total: R$ 0.00</h2>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
